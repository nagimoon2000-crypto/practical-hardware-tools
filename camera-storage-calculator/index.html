camera streams.</p><a href="../">← All six free tools</a></section><section class="tool" id="storage"><div class="toolhead"><span class="number">04</span><div><h2>AI camera storage</h2><p>Plan recording capacity from the measured encoded bitrate of your camera streams.</p></div></div><form data-kind="storage" novalidate><div class="grid"><div><div class="fields"><label for="storage-0">Number of cameras<input id="storage-0" type="number" step="any" value="4" required inputmode="decimal"></label><label for="storage-1">Bitrate per camera (Mbps)<input id="storage-1" type="number" step="any" value="4" required inputmode="decimal"></label><label for="storage-2">Recording hours per day<input id="storage-2" type="number" step="any" value="24" required inputmode="decimal"></label><label for="storage-3">Retention (days)<input id="storage-3" type="number" step="any" value="7" required inputmode="decimal"></label><label for="storage-4">Storage overhead (%)<input id="storage-4" type="number" step="any" value="20" required inputmode="decimal"></label></div><div class="actions"><button type="button" class="secondary">Reset example</button><button type="button" class="download">Download result CSV</button></div></div><div class="result" aria-live="polite" aria-atomic="true"></div></div></form><p class="note">Example: four 4 Mbps cameras recording 24 hours/day for 7 days produce 1.2096 TB of video; adding 20% overhead gives 1.45152 TB.</p><details><summary>How it works &amp; model limitations</summary><p>Daily GB = cameras × Mbps × 0.45 × recording hours. Required TB = daily GB × retention days × (1 + overhead / 100) ÷ 1000. GB and TB use decimal units.</p><p>Enter the measured encoded bitrate, including audio if recorded. AI processing does not determine bitrate. Variable bitrate, motion-triggered recording, metadata, filesystem capacity and RAID reduce predictability. Overhead is an added allowance, not a percentage of disk space reserved. Aggregate bitrate assumes all cameras record simultaneously; network protocol overhead is excluded.</p></details><div class="related">Need a documented test plan and scenario workbook? <a href="https://payhip.com/b/MtxAU?utm_source=free_tools&amp;utm_medium=calculator&amp;utm_campaign=hardware_tools_launch">Explore the Embedded Storage Recovery and Integrity Evidence Pack →</a> <span class="note">Paid resource; this calculator is free.</span></div></section><article class="tool"><h2>How much storage do four cameras need for seven days?</h2><p>Four cameras at 4 Mbps each generate 172.8 decimal GB per day when recording continuously. Seven days gives 1.2096 TB before overhead. Adding a 20% allowance brings the planning value to 1.45152 TB.</p><h3>Try a different scenario</h3><p>Change recording time to 12 hours per day to halve this estimate. Use an observed average encoded bitrate rather than assuming a resolution always produces a fixed bitrate. Disk capacity and write endurance are separate design questions.</p><h3>Before using the result</h3><p>Enter the measured encoded bitrate, including audio if recorded. AI processing does not determine bitrate. Variable bitrate, motion-triggered recording, metadata, filesystem capacity and RAID reduce predictability. Overhead is an added allowance, not a percentage of disk space reserved. Aggregate bitrate assumes all cameras record simultaneously; network protocol overhead is excluded.</p></article><section class="bottom"><h2>More engineering tools</h2><ul><li><a href="../battery-life-calculator/">Battery lifetime calculator and worked example</a></li><li><a href="../camera-motion-blur-calculator/">Camera motion blur calculator and worked example</a></li><li><a href="../supercapacitor-hold-up-calculator/">Supercapacitor hold-up calculator and worked example</a></li><li><a href="../camera-storage-calculator/">AI camera storage calculator and worked example</a></li><li><a href="../edge-ai-fps-calculator/">Edge AI frame-time budget calculator and worked example</a></li><li><a href="../vibration-fft-calculator/">Vibration FFT planning calculator and worked example</a></li></ul></section></main><footer>Practical Hardware Tools · Free engineering estimates · Updated October 2026<br>Your calculator inputs stay in this page. The calculators do not send inputs to a server or store them. Hosting providers may process ordinary access logs. Links to external resources follow their own privacy policies.<br><a href="https://moons66.wordpress.com/">Read the engineering notes</a></footer><noscript>Enable JavaScript to use these calculators. Formulas and limitations remain available below each tool.</noscript><script>function calculate(kind,v){
 if(v.some(x=>!Number.isFinite(x)))throw Error('Complete every field with a finite number.');
 if(kind==='battery'){
  const [c,u,a,t,s,p]=v;
  if(c<=0||u<=0||u>100||a<0||s<0||p<=0||t<0||t>p)throw Error('Use positive capacity and period, 0–100% usable capacity, and active time between zero and the cycle period.');
  const avg=a*t/p+s/1000*(1-t/p);
  if(avg<=0)throw Error('Average current must be greater than zero to estimate lifetime.');
  return [c*u/100/avg/24,avg,c*u/100/avg];
 }
 if(kind==='motion'){
  const [f,n,s,e,b]=v;
  if(f<=0||n<1||!Number.isInteger(n)||s<0||e<0||b<=0)throw Error('Use positive field of view, whole-number pixels and blur limit; speed and exposure cannot be negative.');
  const blur=s*e/1e6/(f/n);
  return [blur,s===0?null:b*(f/n)/s*1e6,b-blur];
 }
 if(kind==='storage'){
  const [n,b,h,d,o]=v;
  if(!Number.isInteger(n)||n<1||b<=0||h<=0||h>24||d<=0||o<0)throw Error('Use whole-number cameras, positive bitrate and days, 0–24 recording hours above zero, and non-negative overhead.');
  const daily=n*b*1e6/8*h*3600/1e9;
  return [daily*d*(1+o/100)/1000,daily,n*b];
 }
 if(kind==='edge'){
  const [a,b,c,d,f]=v;
  const total=a+b+c+d;
  if(v.some(x=>x<0)||f<=0||total<=0)throw Error('Stage times must be non-negative, total time positive and target FPS greater than zero.');
  return [1000/total,total,1000/f-total];
 }
 if(kind==='fft'){
  const [s,n,f]=v;
  if(s<=0||!Number.isInteger(n)||n<2||f<=0||f>=s/2)throw Error('Use positive sample rate, at least 2 whole samples, and a frequency of interest strictly below half the sample rate.');
  return [s/n,n/s,s/2];
 }
 if(kind!=='supercap')throw Error('Unknown calculator.');
 const [c,h,l,e,p]=v;
 if(c<=0||h<=l||l<0||e<=0||e>100||p<=0)throw Error('Use positive capacitance and load, start voltage above minimum voltage, and efficiency above 0% up to 100%.');
 const energy=.5*c*(h*h-l*l);
 return [energy*e/100/p,energy*e/100,energy];
}


const labels={battery:['Estimated lifetime','days','Average battery current','mA','Estimated runtime','hours'],motion:['Predicted motion blur','px','Maximum exposure at your blur limit','µs','Remaining blur budget','px'],supercap:['Estimated hold-up time','seconds','Usable energy after efficiency','J','Stored energy in voltage window','J']};
Object.assign(labels,{storage:['Required storage with overhead','TB','Daily video data before overhead','GB/day','Aggregate encoded bitrate','Mbps'],edge:['Serial processing limit','FPS','Total frame time','ms','Time margin at target FPS','ms'],fft:['Frequency-bin spacing','Hz','Record duration','seconds','Nyquist frequency','Hz']});
const fmt=n=>n===null?'No motion limit':new Intl.NumberFormat('en',{maximumSignificantDigits:6}).format(n);

 form.addEventListener('submit',e=>e.preventDefault());form.addEventListener('input',update);form.querySelector('button').addEventListener('click',()=>{inputs.forEach(i=>i.value=i.defaultValue);update()});
 form.querySelector('.download').addEventListener('click',()=>{update();if(out.classList.contains('invalid'))return;const rows=[['Practical Hardware Tools',kind],...inputs.map(i=>[i.labels[0].textContent,i.value]),['Results',out.textContent],['Note','Planning estimate only; review model limitations.']];const blob=new Blob([rows.map(r=>r.map(x=>'"'+x.replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=kind+'-estimate.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});update();
});
